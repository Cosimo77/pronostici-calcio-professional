name: 🔄 Aggiornamento Automatico Giornaliero

on:
  # Esegui ogni giorno alle 06:00 UTC (07:00 CET / 08:00 CEST)
  schedule:
    - cron: '0 6 * * *'

  # Permetti esecuzione manuale da GitHub UI
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔄 Aggiorna dati Serie A
        run: |
          echo "🚀 Avvio aggiornamento dati..."
          python3 scripts/aggiorna_automatico.py
        env:
          PYTHONUNBUFFERED: 1

      - name: 💾 Backup database diario
        run: |
          echo "💾 Avvio backup database..."
          python3 scripts/backup_automatico.py || echo "⚠️ Backup fallito (normale se DB non accessibile da GitHub)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: 📊 Verifica modifiche
        id: check_changes
        run: |
          git diff --exit-code data/ || echo "changed=true" >> $GITHUB_OUTPUT
          git diff --exit-code backups/ || echo "backup_changed=true" >> $GITHUB_OUTPUT

      - name: 📝 Commit e push modifiche
        if: steps.check_changes.outputs.changed == 'true' || steps.check_changes.outputs.backup_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"

          # Aggiungi solo file rilevanti
          git add data/*.csv
          git add backups/daily_backup_*.json || true

          # Crea commit con timestamp
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          git commit -m "🤖 Aggiornamento automatico dati - ${TIMESTAMP}

          - Dataset aggiornato con nuove partite Serie A
          - Features ML rigenerate
          - Backup database eseguito

          Triggered by: GitHub Actions (scheduled)" || echo "Nessuna modifica da committare"

          git push

      - name: 📢 Notifica completamento
        if: always()
        run: |
          echo "============================================"
          echo "✅ Workflow completato!"
          echo "============================================"
          echo "Timestamp: $(date)"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"

          # Statistiche files
          echo ""
          echo "📊 Files aggiornati:"
          ls -lh data/*.csv | tail -5

          echo ""
          echo "🎯 Next steps:"
          echo "- Render auto-deploya in 1-3 minuti"
          echo "- Check: https://pronostici-calcio-pro.onrender.com"
