name: Daily Predictions & Value Betting

on:
  # Esegui DOPO daily-update (06:00 UTC) per avere dati freschi
  schedule:
    - cron: '30 6 * * *'  # 06:30 UTC giornaliero (07:30 CET / 08:30 CEST)

  # Trigger manuale per test
  workflow_dispatch:

permissions:
  contents: write  # Per committare tracking CSV aggiornato

jobs:
  generate-predictions:
    name: Genera predizioni + value betting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Genera predizioni giornaliere
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/genera_predizioni_giornaliere.py

      - name: Verifica modifiche tracking
        id: check_changes
        run: |
          git diff --quiet tracking_predictions_live.csv || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit tracking aggiornato
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add tracking_predictions_live.csv
          git commit -m "🤖 Auto-update predizioni: $(date +'%Y-%m-%d %H:%M UTC')" -m "Aggiornate predizioni e risultati tracking accuracy"
          git push

      - name: Summary predizioni
        if: always()
        run: |
          echo "## 📊 Predizioni Generate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f tracking_predictions_live.csv ]; then
            total_pred=$(tail -n +2 tracking_predictions_live.csv | wc -l | tr -d ' ')
            value_bets=$(grep -c ",True," tracking_predictions_live.csv || echo "0")

            echo "- **Totale predizioni**: $total_pred" >> $GITHUB_STEP_SUMMARY
            echo "- **Value betting opportunities**: $value_bets" >> $GITHUB_STEP_SUMMARY

            # Mostra ultime 5 predizioni
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Ultime predizioni:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -5 tracking_predictions_live.csv >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ File tracking non generato" >> $GITHUB_STEP_SUMMARY
          fi
