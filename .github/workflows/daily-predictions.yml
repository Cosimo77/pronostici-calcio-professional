name: Daily Predictions & Value Betting

on:
  # Esegui DOPO daily-update (06:00 UTC) per avere dati freschi
  schedule:
    - cron: '30 6 * * *'  # 06:30 UTC giornaliero (07:30 CET / 08:30 CEST)

  # Trigger manuale per test
  workflow_dispatch:

permissions:
  contents: write  # Per committare tracking CSV aggiornato

jobs:
  generate-predictions:
    name: Genera predizioni + value betting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Genera predizioni giornaliere
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/genera_predizioni_giornaliere.py

      - name: Verifica modifiche tracking
        id: check_changes
        run: |
          git diff --quiet tracking_predictions_live.csv || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit tracking aggiornato
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git add tracking_predictions_live.csv
          git commit -m "🤖 Auto-update predizioni: $(date +'%Y-%m-%d %H:%M UTC')" -m "Aggiornate predizioni e risultati tracking accuracy"
          git push

      - name: Summary predizioni
        if: always()
        run: |
          echo "## 📊 Predizioni Generate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f tracking_predictions_live.csv ]; then
            total_pred=$(tail -n +2 tracking_predictions_live.csv | wc -l | tr -d ' ')
            value_bets=$(grep -c ",True," tracking_predictions_live.csv || echo "0")

            echo "- **Totale predizioni**: $total_pred" >> $GITHUB_STEP_SUMMARY
            echo "- **Value betting opportunities**: $value_bets" >> $GITHUB_STEP_SUMMARY

            # Mostra ultime 5 predizioni
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Ultime predizioni:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -5 tracking_predictions_live.csv >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ File tracking non generato" >> $GITHUB_STEP_SUMMARY
          fi

            exit 1
          fi

      - name: "� Verifica Modifiche Tracking File"
        id: check_changes
        if: steps.generate.outputs.tracked > 0
        run: |
          # Il batch endpoint dovrebbe aver già aggiornato il tracking file interno
          # Verifichiamo se ci sono modifiche committabili

          if git diff --quiet data/tracking_predictions_live.csv tracking_predictions_live.csv 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "::warning::Nessuna modifica ai tracking files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "::notice::✅ Tracking files aggiornati con nuove predizioni"
          fi

      - name: "💾 Commit Tracking Aggiornato"
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git add tracking_predictions_live.csv

          git commit -m "🤖 Auto-prediction: ${TRACKED} nuove predizioni tracked (${GENERATED} generate)

          📊 Batch Generation Summary
          - Predizioni generate: ${GENERATED}
          - Tracked (FASE1): ${TRACKED}
          - Filtered out: ${FILTERED}

          Timestamp: $(date -u +"%Y-%m-%d %H:%M UTC")
          Triggered by: Daily workflow" \
            --author="GitHub Actions <actions@github.com>"

          echo "✅ Commit creato"
        env:
          GENERATED: ${{ steps.generate.outputs.generated }}
          TRACKED: ${{ steps.generate.outputs.tracked }}
          FILTERED: ${{ steps.generate.outputs.filtered }}

      - name: "🚀 Push Changes"
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git push origin main
          echo "✅ Tracking file pushato su main → Render auto-deploy triggered"

      - name: "📋 Summary Report"
        if: always()
        run: |
          echo "## 📊 Daily Predictions Generation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ steps.generate.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Predizioni Generate**: ${{ steps.generate.outputs.generated }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tracked (FASE1)**: ${{ steps.generate.outputs.tracked }}" >> $GITHUB_STEP_SUMMARY
          echo "**Filtered Out**: ${{ steps.generate.outputs.filtered }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_changes.outputs.changed }}" = "true" ]; then
            echo "✅ **Tracking file aggiornato e committato**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Nessuna modifica committata**" >> $GITHUB_STEP_SUMMARY
          fi
