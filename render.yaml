services:
  # Web Service Principale - App Professional
  - type: web
    name: pronostici-calcio-pro
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && python3 scripts/build_models_render.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 --worker-class gevent web.app_professional:app
    envVars:
      # DATABASE_URL: Configura manualmente su Render Dashboard dopo migrazione a Neon
      # Valore: postgresql://username:password@ep-xxx.eu-central-1.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ODDS_API_KEY
        value: 7109a3c71a972ef639c56bcf0b13bb4b
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /api/health
    numInstances: 1

# Database Neon PostgreSQL (esterno - FREE permanente)
# Setup: https://neon.tech → Create Project → Europe (Frankfurt)
# Configura DATABASE_URL manualmente su Render Dashboard Environment
