<!-- Script per evidenziare la pagina attiva -->
<script>
    // Evidenzia la pagina attiva nella navbar
    document.addEventListener('DOMContentLoaded', function() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.navbar-nav .nav-link');

        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            if ((href === '/' && currentPath === '/') ||
                (href !== '/' && currentPath.startsWith(href))) {
                link.classList.add('active');
                link.style.background = 'linear-gradient(45deg, #ffd700, #ff6b35)';
                link.style.fontWeight = '700';
            }
        });

        // Gestione theme toggle
        const themeToggle = document.getElementById('navbar-theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        // Carica tema salvato
        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlElement.setAttribute('data-bs-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle?.addEventListener('click', function() {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            if (themeIcon) {
                themeIcon.className = theme === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
            }
        }

        // Aggiorna timestamp (se disponibile via API)
        updateLastUpdate();
    });

    async function updateLastUpdate() {
        try {
            const response = await fetch('/api/dataset_info');
            const data = await response.json();
            const updateElement = document.getElementById('navbar-last-update');
            if (updateElement && data.updated_at) {
                const date = new Date(data.updated_at);
                updateElement.textContent = date.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' });
            }
        } catch (error) {
            console.debug('Navbar: impossibile caricare ultimo aggiornamento');
        }
    }
</script>
